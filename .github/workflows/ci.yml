name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Test
        env:
          # GitHub-hosted runners have Docker, but not this project's image.
          # Tool tests must exercise the local subprocess sandbox.
          REPOSENTINEL_SANDBOX_BACKEND: local
        run: python -m pytest tests -q
